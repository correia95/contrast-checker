    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Colour Contrast Checker",
        "url": "https://contrast-checker.correia95.workers.dev/",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "AUD" },
        "description": "Check colour contrast ratios against WCAG 2.1 AA and AAA thresholds for text and UI components."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What contrast ratio do I need to pass WCAG?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "For WCAG 2.1 Level AA you need a contrast ratio of at least 4.5 to 1 for normal text and 3 to 1 for large text. Level AAA raises this to 7 to 1 for normal text and 4.5 to 1 for large text. User interface components and meaningful graphics need at least 3 to 1."
            }
          },
          {
            "@type": "Question",
            "name": "What is considered large text for contrast?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Large text is at least 18.66 pixels (14 point) and bold, or at least 24 pixels (18 point) at any weight. Large text has a lower contrast requirement because bigger letterforms are easier to read."
            }
          },
          {
            "@type": "Question",
            "name": "How is the contrast ratio calculated?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Each colour is converted to a relative luminance value using the WCAG formula, then the ratio is (lighter luminance + 0.05) divided by (darker luminance + 0.05). The result ranges from 1 to 1 for identical colours up to 21 to 1 for black on white."
            }
          },
          {
            "@type": "Question",
            "name": "Does passing contrast make my site accessible?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "It is one important requirement but not the whole picture. You also need visible focus indicators, information that is not conveyed by colour alone, readable font sizes, and testing with real assistive technology."
            }
          }
        ]
      }
    </script>
